<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanics Phenomena Visualized · Alex Rivera</title>
  <meta name="description" content="An interactive N-body gravity sandbox: launch planets, watch them attract, orbit and merge." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #04060b;
      --line: rgba(96, 164, 255, 0.22);
      --cyan: #7fe3ff;
      --text: #a9c3e0;
      --dim: #7f9cbd;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Title bar ---------- */
    .topbar {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      height: 60px;
      padding: 0 18px;
      background: linear-gradient(180deg, rgba(8, 13, 23, 0.97), rgba(5, 8, 14, 0.9));
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.6);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(14px, 2.1vw, 20px);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #e6f2ff;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 0 24px rgba(84, 180, 255, 0.45);
    }

    .topbar .back {
      justify-self: start;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7fa6cc;
      text-decoration: none;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }

    .topbar .back:hover {
      color: var(--cyan);
      border-color: var(--line);
      background: rgba(70, 150, 255, 0.08);
    }

    .topbar .tag {
      justify-self: end;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: #5f7fa3;
    }

    /* ---------- Stage ---------- */
    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
      user-select: none;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #bg { z-index: 1; }
    #trails { z-index: 2; }
    #sim { z-index: 3; cursor: crosshair; }

    /* ---------- Control panel ---------- */
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 6;
      width: 266px;
      max-height: calc(100% - 92px);
      padding: 14px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(12, 20, 34, 0.93), rgba(7, 11, 20, 0.93));
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(96, 164, 255, 0.16);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #6f90b4;
    }

    .panel-head .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #55e6ff;
      box-shadow: 0 0 8px #55e6ff;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .panel-head .spacer { flex: 1; }
    .panel-head b { font-weight: 600; color: #8fb2d4; }

    .control { margin-bottom: 10px; }

    .control label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .control output {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.03em;
      text-transform: none;
      color: var(--cyan);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      margin: 4px 0 2px;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(66, 136, 226, 0.9), rgba(110, 225, 255, 0.9));
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -4.5px;
      border: 0;
      border-radius: 50%;
      background: #c9f3ff;
      box-shadow: 0 0 9px rgba(110, 225, 255, 0.95);
    }

    input[type="range"]::-moz-range-track {
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(66, 136, 226, 0.9), rgba(110, 225, 255, 0.9));
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #c9f3ff;
      box-shadow: 0 0 9px rgba(110, 225, 255, 0.95);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid rgba(127, 227, 255, 0.55);
      outline-offset: 4px;
      border-radius: 6px;
    }

    /* ---------- Switches ---------- */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .switch-row input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 19px;
      border: 1px solid rgba(110, 160, 220, 0.28);
      border-radius: 99px;
      background: rgba(110, 160, 220, 0.16);
      transition: background 0.18s, border-color 0.18s;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #7b93ad;
      transition: transform 0.18s, background 0.18s;
    }

    .switch-row input:checked + .switch {
      border-color: rgba(110, 225, 255, 0.6);
      background: rgba(80, 205, 255, 0.28);
    }

    .switch-row input:checked + .switch::after {
      transform: translateX(15px);
      background: #9feeff;
      box-shadow: 0 0 9px rgba(110, 225, 255, 0.95);
    }

    .switch-row input:focus-visible + .switch {
      outline: 2px solid rgba(127, 227, 255, 0.55);
      outline-offset: 3px;
    }

    /* ---------- Buttons ---------- */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    .btn {
      height: 30px;
      border: 1px solid rgba(90, 170, 255, 0.28);
      border-radius: 8px;
      background: rgba(70, 150, 255, 0.09);
      color: #b7d4f2;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .btn:hover {
      border-color: rgba(120, 210, 255, 0.55);
      background: rgba(90, 180, 255, 0.18);
      color: #dff4ff;
      box-shadow: 0 0 14px rgba(80, 190, 255, 0.28);
    }

    .btn:active { transform: translateY(1px); }

    .btn.is-active {
      border-color: rgba(255, 190, 110, 0.55);
      background: rgba(255, 170, 80, 0.16);
      color: #ffd9a8;
    }

    /* ---------- HUD ---------- */
    .counter {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: rgba(8, 14, 24, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #7d9bbd;
    }

    .counter strong {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(110, 225, 255, 0.75);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 6;
      transform: translateX(-50%);
      margin: 0;
      padding: 8px 15px;
      border: 1px solid rgba(96, 164, 255, 0.16);
      border-radius: 99px;
      background: rgba(6, 11, 19, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: #88a5c4;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .topbar { height: 54px; padding: 0 12px; }
      .topbar .tag { display: none; }

      .panel {
        top: 10px;
        left: 10px;
        width: min(236px, calc(100vw - 20px));
        max-height: calc(100% - 88px);
        padding: 11px;
      }

      .counter { top: 10px; right: 10px; padding: 6px 10px; }

      .hint {
        bottom: 10px;
        max-width: calc(100% - 20px);
        padding: 7px 11px;
        font-size: 9.5px;
        line-height: 1.4;
        text-align: center;
        white-space: normal;
      }
    }

    @media (max-width: 420px) {
      .panel { width: min(206px, calc(100vw - 20px)); }
      .btn { font-size: 9px; letter-spacing: 0.08em; }
      .counter { font-size: 9px; letter-spacing: 0.1em; }
      .counter strong { font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="back" href="projects.html">← Projects</a>
    <h1>Mechanics Phenomena Visualized</h1>
    <span class="tag">N-BODY / 2D</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="trails" aria-hidden="true"></canvas>
    <canvas id="sim" role="img" aria-label="Interactive gravity simulation. Drag to launch a body, click to place one at rest."></canvas>

    <aside class="panel" aria-label="Simulation controls">
      <div class="panel-head">
        <span class="dot" aria-hidden="true"></span>
        <span>CONTROL</span>
        <span class="spacer"></span>
        <b>N-BODY</b>
      </div>

      <div class="control">
        <label for="gravity">Gravity strength <output id="gravity-out" for="gravity">1.00×</output></label>
        <input type="range" id="gravity" min="0" max="200" step="1" value="100" />
      </div>

      <div class="control">
        <label for="expansion">Universe expansion <output id="expansion-out" for="expansion">0%</output></label>
        <input type="range" id="expansion" min="0" max="100" step="1" value="0" />
      </div>

      <div class="control">
        <label for="mass">New body mass <output id="mass-out" for="mass">5</output></label>
        <input type="range" id="mass" min="1" max="30" step="1" value="5" />
      </div>

      <label class="switch-row">
        <span>Motion trails</span>
        <input type="checkbox" id="trails-toggle" checked />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="switch-row">
        <span>Merge on collision</span>
        <input type="checkbox" id="merge-toggle" checked />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <div class="buttons">
        <button type="button" class="btn" id="pause-btn" aria-pressed="false">Pause</button>
        <button type="button" class="btn" id="clear-btn">Clear</button>
        <button type="button" class="btn" id="galaxy-btn">Galaxy</button>
        <button type="button" class="btn" id="binary-btn">Binary</button>
      </div>
    </aside>

    <div class="counter" aria-live="polite">
      <span>BODIES</span><strong id="count">0</strong>
    </div>

    <p class="hint">Drag to launch a body — Click to place at rest — sliders tune G &amp; expansion</p>
  </main>

  <script>
    (function () {
      'use strict';

      var TAU = Math.PI * 2;
      var G_BASE = 9000;
      var EXPANSION_SCALE = 0.0025;
      var SOFT2 = 18;
      var LAUNCH_K = 5;
      var MAX_SPEED = 2400;
      var STEP = 1 / 120;

      var stage = document.getElementById('stage');
      var bgCanvas = document.getElementById('bg');
      var trailCanvas = document.getElementById('trails');
      var simCanvas = document.getElementById('sim');
      var bg = bgCanvas.getContext('2d');
      var tctx = trailCanvas.getContext('2d');
      var ctx = simCanvas.getContext('2d');

      var countEl = document.getElementById('count');
      var gravityEl = document.getElementById('gravity');
      var gravityOut = document.getElementById('gravity-out');
      var expansionEl = document.getElementById('expansion');
      var expansionOut = document.getElementById('expansion-out');
      var massEl = document.getElementById('mass');
      var massOut = document.getElementById('mass-out');
      var trailsToggle = document.getElementById('trails-toggle');
      var mergeToggle = document.getElementById('merge-toggle');
      var pauseBtn = document.getElementById('pause-btn');
      var clearBtn = document.getElementById('clear-btn');
      var galaxyBtn = document.getElementById('galaxy-btn');
      var binaryBtn = document.getElementById('binary-btn');

      var W = 0;
      var H = 0;
      var dpr = 1;
      var gravityMul = 1;
      var expansion = 0;
      var spawnMass = 5;
      var trailsOn = true;
      var mergeOn = true;
      var paused = false;
      var acc = 0;

      var bodies = [];
      var ghost = null;
      var ghostMass = 0;
      var pointer = { active: false, sx: 0, sy: 0, x: 0, y: 0, pid: null };

      /* ==================== Bodies ==================== */

      function radiusFor(m) {
        return 1.8 + 2.0 * Math.cbrt(m);
      }

      function colorFor(m) {
        var t = Math.min(1, Math.max(0, Math.log(Math.max(m, 1) / 1.5) / Math.log(60)));
        return {
          r: 200 + 55 * t,
          g: 226 - 128 * t,
          b: 255 - 176 * t
        };
      }

      function rgba(c, a) {
        return 'rgba(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ',' + a + ')';
      }

      function makeBody(x, y, vx, vy, m) {
        return {
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          m: m,
          r: radiusFor(m),
          col: colorFor(m),
          sprite: null,
          spriteHalf: 0,
          ax: 0,
          ay: 0
        };
      }

      function ensureSprite(b) {
        if (b.sprite) return;
        var half = Math.max(9, b.r * 2.7);
        var size = Math.ceil(half * 2);
        var c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        var g = c.getContext('2d');
        var grad = g.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, 'rgba(255,255,255,0.98)');
        grad.addColorStop(0.14, rgba(b.col, 1));
        grad.addColorStop(0.36, rgba(b.col, 0.98));
        grad.addColorStop(0.4, rgba(b.col, 0.5));
        grad.addColorStop(0.62, rgba(b.col, 0.12));
        grad.addColorStop(1, rgba(b.col, 0));
        g.fillStyle = grad;
        g.fillRect(0, 0, size, size);
        b.sprite = c;
        b.spriteHalf = half;
      }

      function addBody(x, y, vx, vy, m) {
        x = Math.max(3, Math.min(W - 3, x));
        y = Math.max(3, Math.min(H - 3, y));
        bodies.push(makeBody(x, y, vx, vy, m));
      }

      /* ==================== Physics ==================== */

      function accelerations() {
        var G = G_BASE * gravityMul;
        var n = bodies.length;
        var i;
        var b;

        for (i = 0; i < n; i++) {
          bodies[i].ax = 0;
          bodies[i].ay = 0;
        }

        for (i = 0; i < n; i++) {
          var a = bodies[i];
          for (var j = i + 1; j < n; j++) {
            b = bodies[j];
            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var d2 = dx * dx + dy * dy + SOFT2;
            var inv = 1 / Math.sqrt(d2);
            var inv3 = inv * inv * inv;
            var fa = G * b.m * inv3;
            var fb = G * a.m * inv3;
            a.ax += dx * fa;
            a.ay += dy * fa;
            b.ax -= dx * fb;
            b.ay -= dy * fb;
          }
        }

        if (expansion > 0) {
          var e = expansion * EXPANSION_SCALE;
          var cx = W / 2;
          var cy = H / 2;
          for (i = 0; i < n; i++) {
            b = bodies[i];
            b.ax += (b.x - cx) * e;
            b.ay += (b.y - cy) * e;
          }
        }
      }

      function step(dt) {
        var n = bodies.length;
        var i;
        var b;

        // Kick – drift
        for (i = 0; i < n; i++) {
          b = bodies[i];
          b.vx += b.ax * dt * 0.5;
          b.vy += b.ay * dt * 0.5;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        }

        accelerations();

        // Kick
        for (i = 0; i < n; i++) {
          b = bodies[i];
          b.vx += b.ax * dt * 0.5;
          b.vy += b.ay * dt * 0.5;
        }

        collide();
      }

      function collide() {
        var n = bodies.length;
        var merged = false;

        for (var i = 0; i < n; i++) {
          var a = bodies[i];
          if (a.dead) continue;

          for (var j = i + 1; j < n; j++) {
            var b = bodies[j];
            if (b.dead) continue;

            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var rr = a.r + b.r;
            var d2 = dx * dx + dy * dy;

            if (d2 > rr * rr) continue;

            if (mergeOn) {
              var m = a.m + b.m;
              var x = (a.x * a.m + b.x * b.m) / m;
              var y = (a.y * a.m + b.y * b.m) / m;
              var vx = (a.vx * a.m + b.vx * b.m) / m;
              var vy = (a.vy * a.m + b.vy * b.m) / m;

              var big = a.m >= b.m ? a : b;
              var small = big === a ? b : a;

              big.x = x;
              big.y = y;
              big.vx = vx;
              big.vy = vy;
              big.m = m;
              big.r = radiusFor(m);
              big.col = colorFor(m);
              big.sprite = null;

              small.dead = true;
              merged = true;
            } else {
              var d = Math.sqrt(d2) || 0.0001;
              var nx = dx / d;
              var ny = dy / d;

              var overlap = rr - d;
              if (overlap > 0) {
                var total = a.m + b.m;
                a.x -= nx * overlap * (b.m / total);
                a.y -= ny * overlap * (b.m / total);
                b.x += nx * overlap * (a.m / total);
                b.y += ny * overlap * (a.m / total);
              }

              var rvx = b.vx - a.vx;
              var rvy = b.vy - a.vy;
              var vn = rvx * nx + rvy * ny;

              if (vn < 0) {
                var e = 0.9;
                var imp = -(1 + e) * vn / (1 / a.m + 1 / b.m);
                a.vx -= imp * nx / a.m;
                a.vy -= imp * ny / a.m;
                b.vx += imp * nx / b.m;
                b.vy += imp * ny / b.m;
              }
            }
          }
        }

        if (merged) {
          for (var k = bodies.length - 1; k >= 0; k--) {
            if (bodies[k].dead) bodies.splice(k, 1);
          }
        }
      }

      /* ==================== Scenes ==================== */

      function galaxy() {
        var cx = W / 2;
        var cy = H / 2;
        var G = G_BASE * gravityMul;
        var coreM = 1500;
        var core = makeBody(cx, cy, 0, 0, coreM);
        var maxR = Math.min(W, H) * 0.43;
        var rMin = core.r + Math.max(26, Math.min(W, H) * 0.045);
        var gap = Math.max(13, Math.min(W, H) * 0.028);
        var rings = Math.max(3, Math.floor((maxR - rMin) / gap));
        var perRing = Math.max(5, Math.round(Math.min(W, H) / 90));
        var i;
        var k;

        bodies.push(core);

        /* Concentric rings: every body in a ring shares the same angular
           speed, so neighbours never overtake each other, and the rings are
           spaced wide enough that orbits never touch. Differential rotation
           between rings keeps the disk alive without it collapsing. */
        for (i = 0; i < rings; i++) {
          var r0 = rMin + i * gap + gap * 0.5;
          if (r0 > maxR) break;

          var omega = Math.sqrt(G * coreM / (r0 * r0 * r0));
          var offset = Math.random() * TAU;

          for (k = 0; k < perRing; k++) {
            var m = 0.002 + Math.random() * 0.01;
            var ang = offset + (k / perRing) * TAU + (Math.random() - 0.5) * 0.2;
            var v = omega * r0;

            bodies.push(makeBody(
              cx + Math.cos(ang) * r0,
              cy + Math.sin(ang) * r0,
              -Math.sin(ang) * v,
              Math.cos(ang) * v,
              m
            ));
          }
        }
      }

      function binary() {
        var cx = W / 2;
        var cy = H / 2;
        var G = G_BASE * gravityMul;
        var sep = Math.min(W, H) * 0.2;
        var M = 800;
        var v = Math.sqrt(G * M / (2 * sep));
        var rMin = sep * 1.35;
        var rMax = Math.min(W, H) * 0.46;
        var n = Math.round(Math.min(120, Math.max(40, (W * H) / 7000)));
        var i;

        bodies.push(makeBody(cx - sep / 2, cy, 0, v, M));
        bodies.push(makeBody(cx + sep / 2, cy, 0, -v, M));

        for (i = 0; i < n; i++) {
          var r = rMin + Math.sqrt(Math.random()) * Math.max(1, rMax - rMin);
          var ang = Math.random() * TAU;
          var m = 0.02 + Math.random() * 0.06;
          var av = Math.sqrt(G * (2 * M) / r) * (0.998 + Math.random() * 0.004);

          bodies.push(makeBody(
            cx + Math.cos(ang) * r,
            cy + Math.sin(ang) * r,
            -Math.sin(ang) * av,
            Math.cos(ang) * av,
            m
          ));
        }
      }

      function resetScene(gen) {
        bodies = [];
        acc = 0;
        lastT = 0;
        tctx.clearRect(0, 0, W, H);
        gen();
        accelerations();
      }

      /* ==================== Rendering ==================== */

      function drawBody(b) {
        ensureSprite(b);
        ctx.drawImage(b.sprite, b.x - b.spriteHalf, b.y - b.spriteHalf);
      }

      function drawAim() {
        var dx = pointer.x - pointer.sx;
        var dy = pointer.y - pointer.sy;
        var dist = Math.sqrt(dx * dx + dy * dy);

        ctx.save();
        ctx.globalAlpha = 0.78;
        var g = getGhost();
        ensureSprite(g);
        ctx.drawImage(g.sprite, pointer.sx - g.spriteHalf, pointer.sy - g.spriteHalf);
        ctx.restore();

        if (dist < 6) {
          ctx.setLineDash([4, 4]);
          ctx.strokeStyle = 'rgba(126,220,255,0.5)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(pointer.sx, pointer.sy, g.r + 6, 0, TAU);
          ctx.stroke();
          ctx.setLineDash([]);
          return;
        }

        var ux = dx / dist;
        var uy = dy / dist;
        var len = Math.min(dist, 140);
        var ex = pointer.sx + ux * len;
        var ey = pointer.sy + uy * len;

        ctx.strokeStyle = 'rgba(110,220,255,0.85)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(90,200,255,0.9)';
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(pointer.sx, pointer.sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        var ang = Math.atan2(uy, ux);
        var head = 10;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex - head * Math.cos(ang - 0.45), ey - head * Math.sin(ang - 0.45));
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex - head * Math.cos(ang + 0.45), ey - head * Math.sin(ang + 0.45));
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(150,225,255,0.9)';
        ctx.font = '600 11px "JetBrains Mono", monospace';
        ctx.fillText(Math.round(Math.min(dist * LAUNCH_K, MAX_SPEED)) + ' px/s', ex + 12, ey + 4);
      }

      function getGhost() {
        if (!ghost || ghostMass !== spawnMass) {
          ghostMass = spawnMass;
          ghost = { r: radiusFor(spawnMass), col: colorFor(spawnMass), sprite: null, spriteHalf: 0 };
        }
        return ghost;
      }

      function render() {
        if (trailsOn) {
          tctx.globalCompositeOperation = 'destination-out';
          tctx.fillStyle = 'rgba(0,0,0,0.075)';
          tctx.fillRect(0, 0, W, H);
          tctx.globalCompositeOperation = 'source-over';

          if (!paused) {
            for (var i = 0; i < bodies.length; i++) {
              var b = bodies[i];
              tctx.fillStyle = rgba(b.col, Math.min(0.5, 0.16 + Math.sqrt(b.m) * 0.03));
              tctx.beginPath();
              tctx.arc(b.x, b.y, Math.min(10, Math.max(1.2, b.r * 0.35)), 0, TAU);
              tctx.fill();
            }
          }
        } else {
          tctx.clearRect(0, 0, W, H);
        }

        ctx.clearRect(0, 0, W, H);
        for (var k = 0; k < bodies.length; k++) drawBody(bodies[k]);
        if (pointer.active) drawAim();

        if (countEl.textContent !== String(bodies.length)) {
          countEl.textContent = String(bodies.length);
        }
      }

      function drawBackground() {
        bg.setTransform(dpr, 0, 0, dpr, 0, 0);
        bg.clearRect(0, 0, W, H);

        var grad = bg.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
        grad.addColorStop(0, '#0b1828');
        grad.addColorStop(0.55, '#060a13');
        grad.addColorStop(1, '#020306');
        bg.fillStyle = grad;
        bg.fillRect(0, 0, W, H);

        bg.strokeStyle = 'rgba(86,150,230,0.055)';
        bg.lineWidth = 1;
        var gap = 72;
        var x;
        var y;
        for (x = (W % gap) / 2; x < W; x += gap) {
          bg.beginPath();
          bg.moveTo(x + 0.5, 0);
          bg.lineTo(x + 0.5, H);
          bg.stroke();
        }
        for (y = (H % gap) / 2; y < H; y += gap) {
          bg.beginPath();
          bg.moveTo(0, y + 0.5);
          bg.lineTo(W, y + 0.5);
          bg.stroke();
        }

        var stars = Math.round((W * H) / 5200);
        for (var i = 0; i < stars; i++) {
          var sx = Math.random() * W;
          var sy = Math.random() * H;
          var sr = Math.random() * 1.25 + 0.25;
          var sa = Math.random() * 0.5 + 0.12;
          bg.fillStyle = 'rgba(190,220,255,' + sa.toFixed(2) + ')';
          bg.beginPath();
          bg.arc(sx, sy, sr, 0, TAU);
          bg.fill();
        }

        var vg = bg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.55)');
        bg.fillStyle = vg;
        bg.fillRect(0, 0, W, H);
      }

      /* ==================== Sizing ==================== */

      function resize() {
        var rect = stage.getBoundingClientRect();
        var nw = Math.max(320, Math.round(rect.width));
        var nh = Math.max(220, Math.round(rect.height));

        if (nw === W && nh === H) return;

        var oldW = W;
        var oldH = H;

        W = nw;
        H = nh;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        [bgCanvas, trailCanvas, simCanvas].forEach(function (c) {
          c.width = Math.round(W * dpr);
          c.height = Math.round(H * dpr);
        });

        bg.setTransform(dpr, 0, 0, dpr, 0, 0);
        tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (oldW > 0 && oldH > 0 && bodies.length) {
          var sx = W / oldW;
          var sy = H / oldH;
          for (var i = 0; i < bodies.length; i++) {
            bodies[i].x *= sx;
            bodies[i].y *= sy;
          }
        }

        tctx.clearRect(0, 0, W, H);
        acc = 0;
        drawBackground();
      }

      /* ==================== Loop ==================== */

      var lastT = 0;

      function frame(t) {
        if (!lastT) lastT = t;
        var dt = (t - lastT) / 1000;
        lastT = t;

        if (dt < 0) dt = 0;
        if (dt > 0.05) dt = 0.05;

        if (paused) {
          acc = 0;
        } else {
          acc += dt;
          // Never bank more than four substeps: simulated time can then
          // never outrun the wall clock, even after a stall or tab switch.
          if (acc > STEP * 4) acc = STEP * 4;
          while (acc >= STEP) {
            step(STEP);
            acc -= STEP;
          }
        }

        render();
        requestAnimationFrame(frame);
      }

      /* ==================== Interaction ==================== */

      function pointerPos(e) {
        var rect = simCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      simCanvas.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        var p = pointerPos(e);
        pointer.active = true;
        pointer.sx = p.x;
        pointer.sy = p.y;
        pointer.x = p.x;
        pointer.y = p.y;
        pointer.pid = e.pointerId;

        try {
          simCanvas.setPointerCapture(e.pointerId);
        } catch (err) {
          /* ignore */
        }
      });

      simCanvas.addEventListener('pointermove', function (e) {
        if (!pointer.active) return;
        var p = pointerPos(e);
        pointer.x = p.x;
        pointer.y = p.y;
      });

      function release(e) {
        if (!pointer.active) return;

        var p = pointerPos(e);
        pointer.x = p.x;
        pointer.y = p.y;
        pointer.active = false;

        try {
          simCanvas.releasePointerCapture(pointer.pid);
        } catch (err) {
          /* ignore */
        }
        pointer.pid = null;

        var dx = p.x - pointer.sx;
        var dy = p.y - pointer.sy;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 6) {
          addBody(pointer.sx, pointer.sy, 0, 0, spawnMass);
          return;
        }

        var speed = Math.min(dist * LAUNCH_K, MAX_SPEED);
        addBody(pointer.sx, pointer.sy, (dx / dist) * speed, (dy / dist) * speed, spawnMass);
      }

      simCanvas.addEventListener('pointerup', release);
      simCanvas.addEventListener('pointercancel', function (e) {
        if (!pointer.active) return;
        pointer.active = false;
        try {
          simCanvas.releasePointerCapture(pointer.pid);
        } catch (err) {
          /* ignore */
        }
        pointer.pid = null;
      });

      /* ==================== Controls ==================== */

      gravityEl.addEventListener('input', function () {
        gravityMul = Number(gravityEl.value) / 100;
        gravityOut.textContent = gravityMul.toFixed(2) + '×';
      });

      expansionEl.addEventListener('input', function () {
        expansion = Number(expansionEl.value) / 100;
        expansionOut.textContent = expansionEl.value + '%';
      });

      massEl.addEventListener('input', function () {
        spawnMass = Number(massEl.value);
        massOut.textContent = massEl.value;
      });

      trailsToggle.addEventListener('change', function () {
        trailsOn = trailsToggle.checked;
        if (!trailsOn) tctx.clearRect(0, 0, W, H);
      });

      mergeToggle.addEventListener('change', function () {
        mergeOn = mergeToggle.checked;
      });

      pauseBtn.addEventListener('click', function () {
        paused = !paused;
        pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        pauseBtn.classList.toggle('is-active', paused);
        pauseBtn.setAttribute('aria-pressed', String(paused));
      });

      clearBtn.addEventListener('click', function () {
        bodies = [];
        acc = 0;
        tctx.clearRect(0, 0, W, H);
        render();
      });

      galaxyBtn.addEventListener('click', function () {
        resetScene(galaxy);
      });

      binaryBtn.addEventListener('click', function () {
        resetScene(binary);
      });

      /* ==================== Boot ==================== */

      resize();

      if (window.ResizeObserver) {
        new ResizeObserver(resize).observe(stage);
      } else {
        window.addEventListener('resize', resize);
      }

      resetScene(galaxy);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
